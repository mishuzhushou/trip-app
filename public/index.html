<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>行程助手</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 登录 -->
  <div id="view-login" class="view">
    <div class="login-card">
      <h1>行程助手</h1>
      <p class="muted">高管行程与约车管理</p>
      <input id="f-user" type="text" placeholder="账号" autocomplete="username">
      <input id="f-pass" type="password" placeholder="密码（至少 6 位）" autocomplete="current-password">
      <input id="f-name" type="text" placeholder="你的姓名（注册用）" class="hidden">
      <button id="btn-login" class="primary">登 录</button>
      <button id="btn-register" class="primary hidden">注册管理员账号</button>
      <p id="reg-tip" class="muted" style="font-size:12px;text-align:center"></p>
      <p id="login-err" class="err"></p>
      <p style="text-align:center"><a id="link-toggle-reg" href="#" style="font-size:13px">首次使用？注册管理员账号</a></p>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="view-main" class="view hidden">
    <header>
      <span class="title">行程助手</span>
      <span id="hdr-user" class="muted"></span>
      <button id="btn-logout" class="link-btn">退出</button>
    </header>
    <nav>
      <button data-tab="board" class="active">看板</button>
      <button data-tab="add">登记行程</button>
      <button data-tab="history">历史</button>
      <button data-tab="admin" id="tab-admin">管理</button>
    </nav>

    <!-- 看板 -->
    <section id="tab-board">
      <div class="card-tool">
        <div class="tool-row">
          <input id="board-date" type="date">
          <select id="board-exec"></select>
        </div>
        <div class="tool-row">
          <button id="mode-day" class="chip-btn on">当日</button>
          <button id="mode-all" class="chip-btn">全部行程</button>
          <span class="flex1"></span>
          <label class="small muted" style="display:flex;align-items:center;gap:4px;margin:0"><input type="checkbox" id="f-onlycar" style="width:auto;margin:0"> 只看需约车</label>
          <button id="btn-refresh" class="ghost small">刷新</button>
        </div>
        <div class="tool-row">
          <label class="small muted" style="display:flex;align-items:center;gap:4px;margin:0"><input type="checkbox" id="f-onlymine" style="width:auto;margin:0"> 只看我负责的领导</label>
        </div>
      </div>
      <div id="board-tomorrowcar"></div>
      <div id="board-near"></div>
      <div id="board-list"></div>
    </section>

    <!-- 登记行程 -->
    <section id="tab-add" class="hidden">
      <div class="row">
        <button id="btn-ocr" class="primary small" style="flex:1">📷 拍照 / 选图识别</button>
        <input id="ocr-file" type="file" accept="image/*" capture="environment" style="display:none">
      </div>
      <p id="ocr-hint" class="muted" style="margin:-4px 0 6px">识别订单截图或纸质票据，自动提取车次与时间</p>
      <label class="lbl">行程文本（可直接粘贴，或用上方拍照识别自动填充）</label>
      <textarea id="raw-text" rows="5" placeholder="例：11月12日 G6551次列车(二等座(03车厢,09C号，03车厢),广州东(07:25)-香港西九龙(09:07)，已出票成功。"></textarea>
      <button id="btn-parse" class="primary">智能解析</button>
      <div id="replace-banner" class="warn-card hidden" style="padding:8px;border-radius:8px;margin-bottom:8px">
        <b style="color:#c05621">✏️ 改签模式</b>
        <span id="replace-info" class="small muted"></span>
        <button id="btn-replace-cancel" class="small ghost" style="margin-left:6px">取消改签</button>
      </div>
      <div id="parsed-list"></div>
      <template id="tpl-trip-form">
        <div class="trip-form">
          <label>高管 <select class="f-exec"></select></label>
          <label>日期 <input class="f-date" type="date"></label>
          <div class="segs"></div>
          <button class="btn-addseg ghost small">＋ 添加行程段</button>
          <label class="chk"><input class="f-needcar" type="checkbox" checked> 需要约车</label>
          <div class="car-extra">
            <div class="grid2">
              <label>车型 <select class="f-cartype"><option>送机/站</option><option>接机/站</option><option>临时</option></select></label>
              <label>上车时间 <input class="f-pickupt" type="time"></label>
              <label>上车地点 <input class="f-pickupa" type="text" placeholder="如 白云机场T2"></label>
              <label>下车地点 <input class="f-dropoffa" type="text"></label>
            </div>
            <label>车辆信息（司机/车牌，可留空） <input class="f-carinfo" type="text"></label>
          </div>
          <button class="btn-save primary small">保存该条</button>
        </div>
      </template>
    </section>

    <!-- 历史行程 -->
    <section id="tab-history" class="hidden">
      <div class="card-tool">
        <div class="tool-row">
          <select id="his-exec"><option value="">全部领导</option></select>
          <input id="his-kw" type="text" placeholder="关键词：车次/地点/车牌">
        </div>
        <div class="tool-row">
          <input id="his-from" type="date"> <span class="muted">至</span> <input id="his-to" type="date">
          <button id="btn-his-query" class="primary small">查询</button>
          <span class="flex1"></span>
          <button id="btn-his-export" class="ghost small">📥 导出 Excel</button>
        </div>
        <div class="tool-row">
          <label class="small muted" style="display:flex;align-items:center;gap:4px;margin:0"><input type="checkbox" id="his-onlycar" style="width:auto;margin:0"> 只看需约车</label>
          <span id="his-count" class="muted small"></span>
        </div>
      </div>
      <div id="his-table"></div>
    </section>

    <!-- 管理（所有成员可见"我的高管"自助区；管理员功能区仅管理员可见） -->
    <section id="tab-admin" class="hidden">
      <h3>我的高管</h3>
      <div class="card-tool">
        <b>我负责的高管</b>
        <div id="mine-list"></div>
      </div>
      <div class="card-tool" id="apply-card">
        <b>申请负责其他高管</b>
        <p class="muted small" style="margin:4px 0">点击「申请」提交，管理员同意后即可为该高管登记行程、看行程。</p>
        <div id="apply-list"></div>
      </div>
      <div id="admin-only" class="hidden">
      <h3>待审批申请</h3>
      <div id="admin-applies"></div>
      <h3>秘书 / 账号</h3>
      <div class="admin-item">
        <div class="grid2">
          <input id="new-user-name" type="text" placeholder="登录账号">
          <input id="new-user-real" type="text" placeholder="姓名">
          <input id="new-user-pass" type="password" placeholder="密码（至少 6 位）">
          <select id="new-user-role"><option value="sec">秘书</option><option value="admin">管理员</option></select>
        </div>
        <button id="btn-add-user" class="primary small" style="margin-top:6px">＋ 新增成员账号</button>
      </div>
      <div id="admin-users"></div>
      <h3>高管名单</h3>
      <div id="admin-execs"></div>
      <div class="admin-item">
        <label class="lbl">批量添加高管（每行一条：姓名，称呼，电话 —— 称呼和电话可留空）</label>
        <textarea id="batch-exec-text" rows="5" placeholder="张三，副总裁，13800000000&#10;李四，财务总监&#10;王五"></textarea>
        <button id="btn-batch-exec" class="primary small" style="margin-top:6px">检查并导入</button>
        <p class="muted small" id="batch-exec-result" style="margin-top:6px"></p>
        <div id="batch-exec-dup"></div>
      </div>
      <div class="row">
        <input id="new-exec-name" type="text" placeholder="高管姓名">
        <button id="btn-add-exec" class="primary small">新增</button>
      </div>
      <h3>提醒设置</h3>
      <div id="admin-settings"></div>
      <h3>数据迁移（小程序 → 网页版）</h3>
      <div class="admin-item">
        <label class="lbl">第 1 步：选择 executives.json（云开发数据库 executives 集合导出）</label>
        <input id="import-exec" type="file" accept=".json">
        <label class="lbl">第 2 步：选择 trips.json（trips 集合导出）</label>
        <input id="import-trips" type="file" accept=".json">
        <p class="muted" style="margin:6px 0">导出方法：微信开发者工具 → 云开发 → 数据库 → 选集合 → 导出（格式 JSON）</p>
        <button id="btn-import" class="primary small">开始导入</button>
        <p class="muted" id="import-result"></p>
      </div>
      </div><!-- /admin-only -->
    </section>
  </div>

  <!-- 行程详情编辑（点看板卡片进入） -->
  <div id="trip-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <b>行程详情</b>
        <button id="tm-close" class="link-btn">✕ 关闭</button>
      </div>
      <div class="grid2">
        <label>归属高管 <select id="tm-exec"></select></label>
        <label>日期 <input id="tm-date" type="date"></label>
      </div>
      <div id="tm-segs"></div>
      <button id="tm-addseg" class="ghost small">＋ 添加行程段</button>
      <label class="lbl">行程状态</label>
      <div class="row" id="tm-status" style="margin-bottom:0">
        <button class="chip-btn st" data-v="active">正常</button>
        <button class="chip-btn st" data-v="changed">改签</button>
        <button class="chip-btn st" data-v="cancelled">取消</button>
      </div>
      <p class="muted small" id="tm-change-hint" style="margin:6px 0">改签流程：先选「改签」状态，再点下方按钮重新识别新订票信息，确认后新行程直接顶替本条（原约车确认自动失效）。</p>
      <button id="tm-reenter" class="primary small hidden" style="margin-top:6px">✏️ 重新录入行程（替换本行程）</button>
      <label class="lbl">约车需求</label>
      <div class="grid2">
        <label class="chk" style="margin:0"><input id="tm-needcar" type="checkbox"> 需要约车</label>
        <label class="chk" style="margin:0"><input id="tm-carbooked" type="checkbox"> 确认已约车</label>
        <label>车型 <select id="tm-cartype"><option value=""></option><option>送机/站</option><option>接机/站</option><option>临时</option></select></label>
        <label>上车时间 <input id="tm-pickupt" type="time"></label>
        <label>上车地点 <input id="tm-pickupa" type="text"></label>
        <label>下车地点 <input id="tm-dropoffa" type="text"></label>
      </div>
      <label>车辆信息（司机/车牌） <input id="tm-carinfo" type="text"></label>
      <p class="muted small" id="tm-remind-hint" style="margin:6px 0"></p>
      <label class="lbl">话术生成</label>
      <div class="row" style="margin-bottom:6px">
        <button id="tm-speech-car" class="ghost small" style="flex:1">🚗 约车话术</button>
        <button id="tm-speech-exec" class="ghost small" style="flex:1">📝 汇报话术</button>
      </div>
      <textarea id="tm-speech-out" rows="4" class="hidden" readonly style="font-size:13px"></textarea>
      <button id="tm-copy" class="ghost small hidden" style="margin-top:6px">📋 复制话术</button>
      <label class="lbl">登记原文</label>
      <textarea id="tm-raw" rows="2" disabled style="font-size:12px"></textarea>
      <div class="row" style="margin-top:12px">
        <button id="tm-save" class="primary" style="flex:1">💾 保存全部修改</button>
        <button id="tm-del" class="ghost" style="color:#c53030;border-color:#fbb6b6">🗑 删除</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="vendor/xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
