name: 约车提醒

# 北京时间（UTC+8），触发点特意选在低峰分钟，避开 GitHub Actions 整点排队延迟：
#   07:56 晨间提醒        -> UTC 23:56 -> cron '56 23 * * *'
#   17:16 截止提醒        -> UTC 09:16 -> cron '16 9 * * *'
#   18:16~23:16 每小时催办 -> UTC 10:16~15:16 -> cron '16 10-15 * * *'
# 模式用 github.event.schedule（计划触发的 cron）判断，而非执行时的小时，
# 这样即使任务被平台排队延迟，也不会把晨间/截止误判成催办（凌晨发催办的根源）。
on:
  schedule:
    - cron: '56 23 * * *'
    - cron: '16 9 * * *'
    - cron: '16 10-15 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '提醒模式：morning / deadline / hourly'
        required: false
        default: 'morning'

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: 触发提醒接口
        env:
          MODE_IN: ${{ github.event.inputs.mode }}
          SCHED: ${{ github.event.schedule }}
        run: |
          set -u
          APP="https://trip-app-production-2208f6a5.up.railway.app"
          KEY="tk_7c41e9b2d6f8a03e5b1d"
          if [ -n "$MODE_IN" ]; then
            MODE="$MODE_IN"
          else
            case "$SCHED" in
              '56 23 * * *')    MODE=morning ;;
              '16 9 * * *')     MODE=deadline ;;
              '16 10-15 * * *') MODE=hourly ;;
              *)
                echo "未识别的计划时间($SCHED)，跳过以避免误发"
                exit 0
                ;;
            esac
          fi
          echo "计划触发=$SCHED mode=$MODE"
          URL="$APP/api/cron/remind?mode=$MODE&key=$KEY"
          for i in 1 2 3 4; do
            code=$(curl -s -o resp.json -w "%{http_code}" --max-time 90 "$URL" || echo "000")
            echo "第 $i 次请求 -> HTTP $code"
            cat resp.json 2>/dev/null || true
            echo ""
            if [ "$code" = "200" ]; then
              echo "完成"
              exit 0
            fi
            sleep 25
          done
          echo "多次尝试未成功（服务可能仍在冷启动），下次定时会补发"
          exit 1
